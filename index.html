<meta name='viewport' content='width=device-width, initial-scale=1' />

<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="log.css">
</head>

<body>

    <div class="wrapper">

        <div class="login-box">

            <div class="logo">
                <img src="conceito-de-design-do-logotipo-da-super-nutricao_761413-6186.avif"
                     width="100"
                     height="100">
            </div>

            <h2>LOGIN</h2>

            <input 
                type="text"
                id="codigo-estudante"
                placeholder="Nome da Criança"
                class="input">

            <input
                type="password"
                id="senha"
                placeholder="Senha"
                class="input">

            <button class="btn" id="btn-login">
                ENTRAR
            </button>

            <!-- mensagem de erro -->
            <p id="mensagem"></p>

            <div class="links">
                <a href="esqueceu.html">Esqueceu a senha?</a>
                <a href="login-vidafonte.html">Não tem uma conta? Registre-se</a>
            </div>

        </div>

    </div>

    <!-- JS externo -->
    <script src="pppppp.js"></script>

</body>

</html>
