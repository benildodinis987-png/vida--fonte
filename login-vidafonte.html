<!DOCTYPE html>
<html lang="pt">

<head>

<body>
    <div class="tudo">
        <div class="login-box">
            <div class="logo">

                <img src="conceito-de-design-do-logotipo-da-super-nutricao_761413-6186.avif" width="100" height="100">


            </div>
            <h2>REGISTRO DA CRIANÇA</h2>
            <input type="text" id="nome" placeholder="Nome completo " class="input">
            <input type="date" id="data-nascimento" placeholder="Data de Nascimento" class="input">
            <input type="text" id="bar" placeholder="Onde vive" class="input">

      </select>



            <input type="text" id="telefone" placeholder="Número de Telefone" class="input">

            <input type="password" id="senha" placeholder="Digite a Senha" class="input">
            <input type="password" id="confirmar-senha" placeholder="Confirmar Senha" class="input">


           <button class="btn" onclick="registrar()">REGISTRAR</button>
            
            
            <div class="links">
                Já tem uma conta? <a href="index.html"> Faça login</a>
