<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login-vidafonte</title>
    <link rel="stylesheet" href="log.css">
</head>


<body>
    <div class="tudo">
        <div class="login-box">
            <div class="logo">

                <img src="conceito-de-design-do-logotipo-da-super-nutricao_761413-6186.avif" width="100" height="100">

            </div>

            <h2>REGISTRO DA CRIANÇA</h2>

            <input
                type="text"
                id="nome"
                placeholder="Nome completo da criança"
                class="input"
                autocomplete="name"
            >

            <input
                type="date"
                id="data-nascimento"
                class="input"
            >

            <input
                type="text"
                id="bar"
                placeholder="Onde vive"
                class="input"
                autocomplete="address-level2"
            >

            <select id="gener" class="input">
                <option value="">Escolha o genero</option>
                <option value="1">Homem</option>
                <option value="2">Mulher</option>
                <option value="3">Outro</option>
            </select>

            <input
                type="tel"
                id="telefone"
                placeholder="Número de Telefone"
                class="input"
                maxlength="9"
                inputmode="numeric"
                autocomplete="tel"
            >

            <input
                type="password"
                id="senha"
                placeholder="Digite a Senha"
                class="input"
                minlength="6"
                autocomplete="new-password"
            >

            <input
                type="password"
                id="confirmar-senha"
                placeholder="Confirmar Senha"
                class="input"
                minlength="6"
                autocomplete="new-password"
            >

            <button
                type="button"
                class="btn"
                onclick="registrar()">
                REGISTRAR
            </button>

            <div class="links">
                Já tem uma conta? <a href="index.html"> Faça login</a>
            </div>

        </div>
    </div>


    <!-- POPUP DE SUCESSO -->

    <div id="popupSucesso" class="popup-overlay">

        <div class="popup-box">

            <div class="popup-icon">
                ✓
            </div>

            <h2>Parabéns! 🎉</h2>

            <p>
                Acabou de criar a sua conta na
                <strong>plataforma VidaFonte</strong>.
            </p>

            <p>
                Criança registada:
            </p>

            <h3 id="nomeCriancaPopup"></h3>

            <button
                type="button"
                onclick="fecharPopup()">
                CONTINUAR
            </button>

        </div>

    </div>


    <script src="tresp.js"></script>

</body>

</html>
