<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz da Semana - VidaFonte</title>
    <link rel="stylesheet" href="dentro - Copy (2).css">

</head>

<body>



    <div class="container_quiz">

        <div class="header">

            <div>

                <img src="conceito-de-design-do-logotipo-da-super-nutricao_761413-6186.avif" width="40" height="40">
            </div>
            <div class="nom">
                <strong>VIDAFONTE</strong><br>
                <small>A vida e a fonte de tudo que alimenta</small>
            </div>
            <div>Meu Bebé: Benildo Dinis</div>
        </div>

        <div class="boto">
            <a href="aprender.html">
                <img src="93634.png" width="30" height="30">
            </a>
        </div>


        <h2 class="titulo_quiz">Quiz da Semana</h2>

        <p id="codigo_sessao"></p>

        <!-- Barra de progresso -->
        <div class="barra_progresso">
            <div class="progresso" id="barra"></div>
        </div>

        <!-- Área de perguntas -->
        <div class="area_pergunta">
            <div class="pergunta" id="texto_pergunta"></div>
            <ul class="lista_opcoes" id="lista_opcoes"></ul>

            <button class="botao_proxima" id="botao_proxima">Próxima</button>

        </div>


        <!-- Tela final -->
        <div class="tela_resultado" id="tela_resultado">
            <h3>Resultado Final</h3>
            <p id="texto_resultado"></p>
            <button class="botao_reiniciar" onclick="reiniciarQuiz()">Refazer Quiz</button>
        </div>

    </div>


    <script src="dentro - Copy.js"></script>
</body>

</html>
