        <h2>Denúncia às atividades</h2>

        <p>
            Esta página permite denunciar casos de desnutrição infantil, negligência alimentar ou mau atendimento em unidades de saúde.
        </p>

        <!-- BOTÕES -->
        <div class="selector">

            <button id="btnDesnutricao" class="active" type="button">
                Desnutrição Infantil
            </button>

            <button id="btnHospital" type="button">
                Mau Atendimento
            </button>

        </div>

        <!-- FORMULÁRIO DESNUTRIÇÃO -->
        <form id="formDesnutricao" action="salvar_denuncia.php" method="POST" style="display:block;">

            <div class="section">

                <label for="nomeCrianca">
                    Nome da Criança
                </label>

                <input type="text" id="nomeCrianca" name="nomeCrianca" required>

                <label for="idadeCrianca">
                    Idade
                </label>

                <input type="number" id="idadeCrianca" name="idadeCrianca" min="0" max="18" required>

                <label for="localidade">
                    Localidade / Bairro
                </label>

                <input type="text" id="localidade" name="localidade" required>

                <label for="descricao">
                    Descrição da Situação
                </label>

                <textarea id="descricao" name="descricao" rows="4" placeholder="Explique sinais de desnutrição..." required></textarea>

                <button type="submit">
                    Enviar Denúncia
                </button>

                <div id="msgDesnutricao" class="success"></div>

            </div>

        </form>

        <!-- FORMULÁRIO HOSPITAL -->
        <form id="formHospital" action="salvar_hospital.php" method="POST" style="display:none;">

            <div class="section">

                <label for="hospital">
                    Nome do Hospital/Posto de Saúde
                </label>

                <input type="text" id="hospital" name="hospital">

                <label for="problemaHospital">
                    Descrição do Problema
                </label>

                <textarea id="problemaHospital" name="problemaHospital" rows="4" placeholder="Explique o problema..."></textarea>

                <label for="nomeDenunciante">
                    Seu Nome (opcional)
                </label>

                <input type="text" id="nomeDenunciante" name="nomeDenunciante">

                <label for="contato">
                    Contato (opcional)
                </label>

                <input type="text" id="contato" name="contato">

                <button type="submit">
                    Enviar Denúncia
                </button>

                <div id="msgHospital" class="success"></div>

            </div>

        </form>

        <!-- BOTÃO PDF -->
        <div class="relat">

            <button type="button">
                Baixar minha denúncia
            </button>

        </div>

    </div>

    <script src="denn.js"></script>
